# Instructor overlay: author checkpoints and edit the FileSource CSVs live.
#   docker compose -f compose.yaml -f compose.author.yaml up -d
#   docker compose exec registry workshop checkpoint 04-filesource-synced "FileSource synced"
# New checkpoints land in ./image/checkpoints and CSV edits in ./image/data/filesource are visible to
# the Registry immediately (the file is re-read on every sync). Rebuild the image to bake them in.
# Add DEBUG=true to .env for CakePHP's friendlier error pages (and the DebugKit toolbar).
services:
  registry:
    volumes:
      - ./image/checkpoints:/opt/workshop/checkpoints
      - ./image/data/filesource:/srv/comanage-registry/local/filesource

# COmanage Registry virtual hosts for the workshop.
#
# Upstream's entrypoint (comanage_utils::prepare_virtual_host) generates this file unless one already exists.
# The workshop supplies its own through the slashRoot mechanism, because the only change it needs - anonymous
# login - cannot be set with environment variables. Everything else follows the vhost upstream generates for the
# basic-auth image, except:
#   - login: AuthBasicProvider anon instead of file (any username, empty password; upstream: htpasswd file);
#   - UseCanonicalName Off and no HSTS header, so it works on remapped localhost ports;
#   - plain HTTP redirects to the published HTTPS port instead of a hardcoded :443.
# Apache does not allow a comment on the same line as a directive.

<VirtualHost *:80>
ServerName localhost
UseCanonicalName Off

Header set Content-Security-Policy "frame-ancestors 'self';"

RewriteEngine On
RewriteCond %{HTTPS} off
RewriteRule ^ https://%{SERVER_NAME}:${COMANAGE_REGISTRY_VIRTUAL_HOST_PORT}%{REQUEST_URI} [R=302,L,QSA]
</VirtualHost>

<VirtualHost *:443>
ServerName localhost
UseCanonicalName Off

Header set Content-Security-Policy "frame-ancestors 'self';"

SSLEngine on
SSLProtocol all -SSLv2 -SSLv3
SSLCipherSuite EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH
SSLHonorCipherOrder on

SSLCertificateFile /etc/apache2/cert.pem
SSLCertificateKeyFile /etc/apache2/privkey.pem
DocumentRoot /var/www/html

RedirectMatch ^/$ /registry/
LogFormat "%a %h %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" combined
LogLevel warn
ErrorLog ${APACHE_LOG_DIR}/error.log
CustomLog ${APACHE_LOG_DIR}/access.log combined

<Directory /var/www/html/registry>
Options Indexes FollowSymLinks
DirectoryIndex index.php
AllowOverride All
Require all granted
</Directory>

# Workshop login: ANY username is accepted and becomes REMOTE_USER; the password may be left empty.
# "admin" is the platform administrator. Never publish this port beyond 127.0.0.1.
<Directory /var/www/html/registry/auth/login>
AuthType Basic
AuthName "COmanage Registry workshop: type any username, leave the password empty"
AuthBasicProvider anon
Anonymous *
Anonymous_NoUserID Off
Anonymous_MustGiveEmail Off
Anonymous_VerifyEmail Off
Anonymous_LogEmail Off
Require valid-user
</Directory>

</VirtualHost>

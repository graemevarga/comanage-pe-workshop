# Build the COmanage Registry 5.2.0 image exactly as the upstream release builds it (its own container/build.sh,
# basic-auth variant, unmodified), push it to GHCR, then start the workshop's compose stack with it and check it.
#
# Release: push a tag such as v5.2.0-1  ->  ghcr.io/graemevarga/comanage-registry:5.2.0-basic-auth-1
#          (the number after the dash is upstream build.sh's tag suffix).
# Manual run: rebuilds and re-pushes the suffix given as input.
name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      suffix:
        description: build.sh tag suffix (the image becomes comanage-registry:5.2.0-basic-auth-<suffix>)
        required: true
        default: '1'

env:
  REGISTRY_TAG: 5.2.0
  REGISTRY_COMMIT: c5e9be6fddbd2b659d89741e2178edb95d5388f0
  IMAGE_REPO: ghcr.io/graemevarga/comanage-registry

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - name: Work out the tag suffix
        id: tag
        run: |
          if [ "${GITHUB_EVENT_NAME}" = workflow_dispatch ]; then
            suffix='${{ inputs.suffix }}'
          else
            suffix="${GITHUB_REF_NAME##*-}"
          fi
          case "${suffix}" in ''|*[!A-Za-z0-9._]*) echo "bad suffix '${suffix}'"; exit 1 ;; esac
          echo "suffix=${suffix}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE_REPO}:${REGISTRY_TAG}-basic-auth-${suffix}" >> "$GITHUB_OUTPUT"

      - name: Fetch the upstream 5.2.0 release and check it is the tagged commit
        run: |
          curl -fsSL --retry 5 -o registry.tar.gz \
            "https://github.internet2.edu/COmanage/registry/archive/refs/tags/${REGISTRY_TAG}.tar.gz"
          test "$(gzip -dc registry.tar.gz | head -c 1536 | grep -a -o 'comment=[0-9a-f]*' | cut -d= -f2)" = "${REGISTRY_COMMIT}"
          mkdir upstream
          tar -xzf registry.tar.gz --strip-components=1 -C upstream

      - name: Build with upstream's container/build.sh
        working-directory: upstream
        run: ./container/build.sh -s '${{ steps.tag.outputs.suffix }}' --label "${REGISTRY_TAG}" registry basic-auth

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        run: |
          # build.sh 5.2.0 ignores --image_registry/--repository, so tag the result for GHCR afterwards.
          docker tag "comanage-registry:${REGISTRY_TAG}-basic-auth-${{ steps.tag.outputs.suffix }}" '${{ steps.tag.outputs.image }}'
          docker push '${{ steps.tag.outputs.image }}'

  verify:
    needs: build
    runs-on: ubuntu-24.04
    env:
      REGISTRY_IMAGE: ${{ needs.build.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start the stack (first start on an empty database)
        run: |
          docker compose up -d
          for _ in $(seq 1 90); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q registry)")" = healthy ] && break
            sleep 5
          done
          docker compose ps

      - name: Anonymous login, Mailpit, checkpoints
        run: |
          set -x
          base=https://localhost:8443/registry
          test "$(curl -ks -o /dev/null -w '%{http_code}' "$base/")" = 200
          test "$(curl -ks -o /dev/null -w '%{http_code}' "$base/auth/login/login.php")" = 401
          test "$(curl -ks -u admin: -o /dev/null -w '%{http_code}' "$base/auth/login/login.php")" = 302
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8025/)" = 200
          ./workshop restore 04-filesource-synced
          test "$(docker compose exec -T registry-database psql -U registry_user -d registry -Atc \
            "select count(*) from people where co_id = 3 and person_id is null and deleted is not true")" = 45
          ./workshop restore 06-enrollment
          ./workshop mail-test 1
          curl -s http://localhost:8025/api/v1/messages | grep -q 'TestCommand Test Message'

      - name: Logs on failure
        if: failure()
        run: |
          docker compose logs --no-color 2>&1 | grep -v ' debug: ' | tail -300

  # Apple Silicon Macs run the amd64 registry image under emulation; QEMU on an arm64 runner is a slower stand-in.
  verify-emulated:
    needs: build
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    env:
      REGISTRY_IMAGE: ${{ needs.build.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start the stack with an emulated registry container
        run: |
          docker compose up -d
          for _ in $(seq 1 120); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q registry)")" = healthy ] && break
            sleep 10
          done
          docker compose ps
          test "$(curl -ks -u admin: -o /dev/null -w '%{http_code}' https://localhost:8443/registry/auth/login/login.php)" = 302

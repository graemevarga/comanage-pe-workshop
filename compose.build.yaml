# Build the image locally instead of pulling it (maintainers; needs internet access to
# github.internet2.edu, github.com, Docker Hub and Debian mirrors):
#   docker compose -f compose.yaml -f compose.build.yaml build
#   docker compose -f compose.yaml -f compose.build.yaml up -d
services:
  registry:
    build:
      context: ./image
      args:
        # Set COMANAGE_REGISTRY_WEBROOT=registry in .env for upstream's /registry/ path.
        COMANAGE_REGISTRY_WEBROOT: ${COMANAGE_REGISTRY_WEBROOT:-registry-pe}

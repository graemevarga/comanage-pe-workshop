
# ---- COmanage PE workshop overrides (appended by workshop-init-db) ----
listen_addresses = '127.0.0.1'
max_connections = 50
shared_buffers = 128MB
log_destination = 'stderr'
logging_collector = off
log_line_prefix = '%m [%p] postgres: '
# No query is big enough to benefit from LLVM JIT; don't load it.
jit = off

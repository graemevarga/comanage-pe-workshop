# PostgreSQL client authentication for the workshop container.
# The server listens on 127.0.0.1 inside the container only; nothing outside the container can reach it.
# TYPE  DATABASE  USER  ADDRESS        METHOD
local   all       all                  trust
host    all       all   127.0.0.1/32   scram-sha-256
host    all       all   ::1/128        scram-sha-256

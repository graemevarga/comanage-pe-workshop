; COmanage PE workshop: one container, four processes, supervisord as PID 1.
; Everything logs to the container's stdout/stderr (docker compose logs).

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock
chmod=0700
; root-only socket; the credentials just stop supervisord logging a CRIT warning
username=workshop
password=workshop

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock
username=workshop
password=workshop

; Mail catcher: SMTP 127.0.0.1:1025 (container only), web UI on :8025.
[program:mailpit]
priority=5
command=/usr/local/bin/mailpit --smtp 127.0.0.1:1025 --listen 0.0.0.0:8025 --smtp-auth-accept-any --smtp-auth-allow-insecure --disable-version-check
user=nobody
directory=/tmp
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Database: listens on 127.0.0.1:5432 inside the container only. SIGINT = fast shutdown.
[program:postgres]
priority=10
command=/bin/sh -c 'mkdir -p /run/postgresql && chown postgres:postgres /run/postgresql && exec setpriv --reuid=postgres --regid=postgres --init-groups /usr/lib/postgresql/15/bin/postgres -D "$PGDATA"'
stopsignal=INT
stopwaitsecs=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Registry: upstream's entrypoint (waits for the database, re-runs the idempotent database/setup steps,
; clears caches), then Apache in the foreground. SIGWINCH = graceful Apache stop.
[program:apache2]
priority=20
command=/usr/local/bin/workshop-entrypoint apache2-foreground
stopsignal=WINCH
stopwaitsecs=15
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Queue runner: every JOB_INTERVAL seconds, runs queued Registry jobs for each active CO, as www-data.
[program:jobs]
priority=30
command=/usr/local/bin/workshop-jobs
stopsignal=TERM
stopwaitsecs=15
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
